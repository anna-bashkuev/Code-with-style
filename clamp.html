<!DOCTYPE html>

        /* Paste the h1 rule here (the one above) */
    </style>
</head>

<body>
    <div class="container">
        <section>
            <h1 class="fixed-px">Fixed‑Pixel Size</h1>
            <p>Changing the browser width does not affect the headline size.</p>
        </section>

        <section>
            <h1 class="relative">Relative Size</h1>
            <p>Depends on the viewport size. </p>
        </section>

        <section>
            <h1 class="clamp">clamp() </h1>
            <p>Automatically grows/shrinks between min & max values as the viewport changes.</p>
        </section>
  </div>
