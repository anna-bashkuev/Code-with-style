onlyBuiltDependencies:
  - msw
  - sharp

# This pnpm build (11.15.1, supply-chain policy enforced) errors on ignored
# builds and does NOT honor onlyBuiltDependencies, so msw/sharp post-install
# scripts stay blocked. dangerouslyAllowAllBuilds is the only setting that
# actually permits them here and clears ERR_PNPM_IGNORED_BUILDS.
dangerouslyAllowAllBuilds: true

overrides:
  hono: 4.12.25
